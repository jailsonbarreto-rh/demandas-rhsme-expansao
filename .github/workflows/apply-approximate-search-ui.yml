name: Apply approximate search UI

on:
  push:
    branches:
      - feat/busca-resultados-proximos-20260720

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/busca-resultados-proximos-20260720
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply verified integration
        run: |
          node scripts/apply-approximate-search-ui.mjs
          git diff --check
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "Integração já aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/DemandasTable.tsx src/index.css
          git commit -m "feat: integrar resultados próximos na interface"
          git push origin HEAD:feat/busca-resultados-proximos-20260720
