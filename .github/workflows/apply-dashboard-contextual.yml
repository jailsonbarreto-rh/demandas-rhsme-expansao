name: Apply contextual dashboard patch

on:
  push:
    branches:
      - fix/r3-dashboard-contextual

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/r3-dashboard-contextual

      - name: Route scoped demands to the header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """        <Header
          userEmail={userEmail}
          demandas={demandas}
"""
          new = """        <Header
          userEmail={userEmail}
          demandas={workspaceDemandas}
"""
          if old not in text:
              raise SystemExit('Expected Header block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit functional correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: contextualizar indicadores pela carteira ativa"
          git push origin HEAD:fix/r3-dashboard-contextual
