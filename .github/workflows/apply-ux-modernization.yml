name: Apply UX modernization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-ux-modernization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'feat/ux-profissional-central-demandas'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ux-profissional-central-demandas
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and verify implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ux-transfer/payload.part.0[0-7] > /tmp/ux-modernization.b64
          python - <<'PY'
          from pathlib import Path
          hex_text = ''.join(
              path.read_text(encoding='ascii').strip()
              for path in sorted(Path('.github/ux-transfer').glob('tail.hex.part.*'))
          )
          with Path('/tmp/ux-modernization.b64').open('ab') as target:
              target.write(bytes.fromhex(hex_text))
          PY
          base64 --decode /tmp/ux-modernization.b64 > /tmp/ux-modernization.tar.xz
          echo 'd24bce53d9351d60728d8ee2172c2a659e4ebc6d0f4f8ec898389d6411dbbb56  /tmp/ux-modernization.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ux-modernization.tar.xz

      - name: Apply verified accessibility and routing fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ux-transfer/fixes.part.* > /tmp/ux-fixes.b64
          base64 --decode /tmp/ux-fixes.b64 > /tmp/ux-fixes.tar.xz
          echo '030bd4712a63d2906effda874c6d205dc213e57384e3e827a68fd4da4f78c4c1  /tmp/ux-fixes.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ux-fixes.tar.xz

      - name: Normalize npm registry references
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/#https://registry.npmjs.org/#g' package-lock.json
          if grep -q 'packages.applied-caas-gateway1.internal.api.openai.org' package-lock.json; then
            echo 'Internal npm registry reference remains in package-lock.json.' >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: timeout 8m npm ci --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=60000

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Enforce bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-browser-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit verified implementation and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ux-transfer .github/ux-patches
          rm -f .github/workflows/export-source-temporary.yml
          rm -f .github/workflows/inspect-ux-payload.yml
          rm -f .github/workflows/apply-ux-modernization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: elevar experiência de uso da Central de Demandas'
          git push origin HEAD:feat/ux-profissional-central-demandas
