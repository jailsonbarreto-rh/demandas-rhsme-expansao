name: Audit legacy authenticated shell

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-legacy-auth.yml
      - .audit/legacy-auth-trigger.txt

permissions:
  contents: read

jobs:
  authenticated-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read temporary credentials from event metadata
        id: credentials
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, re
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          body=(event.get('pull_request') or {}).get('body') or ''
          match=re.search(r'LEGACY_AUTH_B64=([A-Za-z0-9+/=]+)', body)
          if not match:
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('available=false\n')
              raise SystemExit(0)
          data=json.loads(base64.b64decode(match.group(1)).decode('utf-8'))
          email=data['email']; password=data['password']
          print(f'::add-mask::{email}'); print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'LEGACY_EMAIL={email}\nLEGACY_PASSWORD={password}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('available=true\n')
          PY

      - name: Install browser
        if: steps.credentials.outputs.available == 'true'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Crawl accessible authenticated modules without mutations
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p legacy-crawl-fast/screens
          cat > legacy-crawl-fast/crawl.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          const base='https://rh-sme.web.app/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:'pt-BR'});
          const page=await context.newPage();
          const allNetwork=[]; const consoleEvents=[]; const pageErrors=[];
          page.on('request',r=>{const u=r.url();if(/googleapis|firebase|firestore|rh-sme\.web\.app/.test(u))allNetwork.push({phase:'request',method:r.method(),type:r.resourceType(),url:u});});
          page.on('response',r=>{const u=r.url();if(/googleapis|firebase|firestore|rh-sme\.web\.app/.test(u))allNetwork.push({phase:'response',status:r.status(),url:u,contentType:r.headers()['content-type']||null});});
          page.on('console',m=>consoleEvents.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));

          async function waitText(text,timeout=15000){
            const end=Date.now()+timeout;
            while(Date.now()<end){if((await page.locator('body').innerText().catch(()=>'' )).includes(text))return true;await page.waitForTimeout(300);}return false;
          }
          async function home(){await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});await waitText('Bem-vindo,',15000);await page.waitForTimeout(700);}
          await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
          await page.locator('input[type=email]').fill(process.env.LEGACY_EMAIL);
          await page.locator('input[type=password]').fill(process.env.LEGACY_PASSWORD);
          await page.getByText('Entrar',{exact:true}).click();
          if(!await waitText('Bem-vindo,',20000))throw new Error('login failed');

          const scenarios=[
            ['principal',[]],
            ['demandas',['Demandas']],
            ['demandas-novo-registro',['Demandas','Novo Registro']],
            ['avaliacao-menu',['Avaliação']],
            ['avaliacao-auto',['Avaliação','Autoavaliação']],
            ['avaliacao-descendente',['Avaliação','Avaliação Descendente']],
            ['avaliacao-ascendente',['Avaliação','Avaliação Ascendente']],
            ['avaliacao-relatorio-individual',['Avaliação','Relatório Individual']],
            ['avaliacao-pdi',['Avaliação','PDI (Plano de Desenvolvimento)']],
            ['ferramentas-menu',['Ferramentas']],
            ['divisor-excel',['Ferramentas','Divisor de Excel']],
            ['eventos-cursos',['Eventos e Cursos']]
          ];
          const results=[];
          async function visibleTextLocator(text){
            const loc=page.getByText(text,{exact:true});
            const n=await loc.count();
            for(let i=0;i<n;i++){const x=loc.nth(i);if(await x.isVisible().catch(()=>false))return x;}
            return null;
          }
          async function capture(slug,meta,startNetwork){
            const data=await page.evaluate(()=>{const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)!==0&&r.width>0&&r.height>0};const clean=s=>(s||'').replace(/\s+/g,' ').trim();return {title:document.title,url:location.href,text:clean(document.body?.innerText||''),controls:[...document.querySelectorAll('button,[role=button],a,[tabindex="0"]')].filter(vis).map((e,i)=>({i,tag:e.tagName,role:e.getAttribute('role'),text:clean(e.innerText||e.getAttribute('aria-label')),href:e.href||null,disabled:!!e.disabled})),inputs:[...document.querySelectorAll('input,select,textarea')].filter(vis).map((e,i)=>({i,tag:e.tagName,type:e.type||null,placeholder:e.placeholder||null,required:!!e.required,disabled:!!e.disabled,ariaLabel:e.getAttribute('aria-label')})),headings:[...document.querySelectorAll('h1,h2,h3,h4,[role=heading]')].filter(vis).map((e,i)=>({i,text:clean(e.innerText),level:e.getAttribute('aria-level')})),dimensions:{width:document.body.scrollWidth,height:document.body.scrollHeight}}});
            await page.screenshot({path:`legacy-crawl-fast/screens/${slug}.png`,fullPage:true});
            const rec={slug,...meta,...data,network:allNetwork.slice(startNetwork)};results.push(rec);await fs.writeFile(`legacy-crawl-fast/screens/${slug}.json`,JSON.stringify(rec,null,2));
          }
          for(const [slug,steps] of scenarios){
            const startNetwork=allNetwork.length;const meta={steps,reached:true,failedAt:null,error:null};
            try{await home();for(const step of steps){const loc=await visibleTextLocator(step);if(!loc){meta.reached=false;meta.failedAt=step;break;}await loc.click({timeout:8000});await page.waitForTimeout(1200);}}
            catch(e){meta.reached=false;meta.error=String(e.stack||e);}
            await capture(slug,meta,startNetwork);
          }
          await fs.writeFile('legacy-crawl-fast/summary.json',JSON.stringify(results,null,2));
          await fs.writeFile('legacy-crawl-fast/console.json',JSON.stringify(consoleEvents,null,2));
          await fs.writeFile('legacy-crawl-fast/page-errors.json',JSON.stringify(pageErrors,null,2));
          await browser.close();
          JS
          node legacy-crawl-fast/crawl.mjs

      - name: Upload authenticated crawl evidence
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-authenticated-crawl-fast
          path: legacy-crawl-fast
          retention-days: 1
          if-no-files-found: error
