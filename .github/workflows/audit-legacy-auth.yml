name: Verify deployed legacy RH clone

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-legacy-auth.yml
      - .audit/legacy-auth-trigger.txt

permissions:
  contents: read

jobs:
  browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify clone interface and data loading
        shell: bash
        run: |
          mkdir -p clone-verification
          cat > clone-verification/verify.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';

          const base='https://demandas-rhsme-nine.vercel.app';
          const access='https://demandas-rhsme-nine.vercel.app/?_vercel_share=t7mzXHmoccQMnHMO9EGO78xT1kQY4Xzi';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:'pt-BR'});
          const page=await context.newPage();
          const consoleEvents=[]; const pageErrors=[]; const requests=[]; const responses=[];
          page.on('console',m=>consoleEvents.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));
          page.on('request',r=>requests.push({url:r.url(),method:r.method(),resourceType:r.resourceType()}));
          page.on('response',r=>responses.push({url:r.url(),status:r.status()}));

          const result={base,homeText:'',demandsText:'',validationText:'',rowCount:0,dataResponse:null,consoleEvents,pageErrors,unexpectedRequests:[],failure:null};
          try {
            await page.goto(`${access}#/home`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForFunction(()=>document.body.innerText.includes('Sistema de RH'),null,{timeout:30000});
            result.homeText=(await page.locator('body').innerText()).slice(0,3000);
            await page.screenshot({path:'clone-verification/home.png',fullPage:true});
            if(!result.homeText.includes('Demandas')||!result.homeText.includes('Avaliação')||!result.homeText.includes('Eventos e')||!result.homeText.includes('Cursos')) throw new Error(`Módulos esperados ausentes da página inicial. Texto: ${result.homeText}`);

            requests.length=0; responses.length=0; consoleEvents.length=0; pageErrors.length=0;
            await page.goto(`${base}/#/demandas`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForFunction(()=>document.querySelectorAll('tbody tr').length===50,null,{timeout:60000});
            result.demandsText=(await page.locator('body').innerText()).slice(0,5000);
            result.rowCount=await page.locator('tbody tr').count();
            if(!result.demandsText.includes('Controle de Demandas')) throw new Error('Tela de demandas não carregou');
            await page.screenshot({path:'clone-verification/demandas.png',fullPage:true});

            await page.goto(`${base}/#/validacao`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForFunction(()=>document.body.innerText.includes('3.201 documentos'),null,{timeout:60000});
            result.validationText=(await page.locator('body').innerText()).slice(0,3000);
            if(!result.validationText.includes('Validação de Migração')) throw new Error('Ferramenta de validação não carregou');
            await page.screenshot({path:'clone-verification/validacao.png',fullPage:true});

            result.dataResponse=responses.find(r=>r.url.includes('/data/demandas-legado.json'))||null;
            if(!result.dataResponse||result.dataResponse.status!==200) throw new Error('Snapshot de demandas não foi carregado com HTTP 200');
            result.unexpectedRequests=requests.filter(r=>!r.url.startsWith(base)&&!r.url.startsWith('data:')&&!r.url.startsWith('blob:'));
            if(result.unexpectedRequests.length) throw new Error(`Requisições externas inesperadas: ${JSON.stringify(result.unexpectedRequests)}`);
            if(pageErrors.length) throw new Error(`Erros de página: ${JSON.stringify(pageErrors)}`);
          } catch(error) {
            result.failure=String(error.stack||error);
            await page.screenshot({path:'clone-verification/failure.png',fullPage:true}).catch(()=>{});
          } finally {
            await fs.writeFile('clone-verification/result.json',JSON.stringify(result,null,2));
            await browser.close();
          }
          if(result.failure) throw new Error(result.failure);
          JS
          node clone-verification/verify.mjs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-legacy-clone-verification
          path: clone-verification
          retention-days: 1
          if-no-files-found: error
