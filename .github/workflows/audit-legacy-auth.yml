name: Export readable legacy demands

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-legacy-auth.yml
      - .audit/legacy-auth-trigger.txt

permissions:
  contents: read

jobs:
  export-demands:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CREDENTIAL_BLOB_SHA: 4fced64e21215d0e4bdc53f7b3f0c59977754a5a
      FIREBASE_API_KEY: AIzaSyBfRFHI4Zt_E0vuO0qZCvju6X6JJH_D-9s
      FIREBASE_PROJECT_ID: contratos-sme
    steps:
      - uses: actions/checkout@v4

      - name: Load temporary credentials from unreferenced private blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${CREDENTIAL_BLOB_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/legacy-credentials.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/legacy-credentials.json').read_text())
          email=data['email']; password=data['password']
          print(f'::add-mask::{email}')
          print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'LEGACY_EMAIL={email}\n')
              f.write(f'LEGACY_PASSWORD={password}\n')
          PY
          rm -f /tmp/legacy-credentials.json

      - name: Export Firestore documents in read-only mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-demand-export
          cat > legacy-demand-export/export.mjs <<'JS'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';

          const apiKey=process.env.FIREBASE_API_KEY;
          const projectId=process.env.FIREBASE_PROJECT_ID;
          const email=process.env.LEGACY_EMAIL;
          const password=process.env.LEGACY_PASSWORD;
          const appOrigin='https://rh-sme.web.app';

          async function jsonFetch(url, options={}) {
            const response=await fetch(url, options);
            const text=await response.text();
            let body;
            try { body=text ? JSON.parse(text) : {}; }
            catch { body={raw:text}; }
            if(!response.ok) {
              const err=new Error(`HTTP ${response.status} ${response.statusText}`);
              err.status=response.status;
              err.body=body;
              throw err;
            }
            return body;
          }

          const auth=await jsonFetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(apiKey)}`,{
            method:'POST',
            headers:{
              'content-type':'application/json',
              'Origin':appOrigin,
              'Referer':`${appOrigin}/`
            },
            body:JSON.stringify({email,password,returnSecureToken:true})
          });
          const token=auth.idToken;
          const headers={Authorization:`Bearer ${token}`,'content-type':'application/json'};

          let rawDocuments=[];
          let extractionMode='listDocuments';
          let listFailure=null;
          try {
            let pageToken='';
            do {
              const url=new URL(`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/demandas/registros/demandasrj2`);
              url.searchParams.set('pageSize','1000');
              if(pageToken) url.searchParams.set('pageToken',pageToken);
              const page=await jsonFetch(url,{headers:{Authorization:`Bearer ${token}`}});
              rawDocuments.push(...(page.documents||[]));
              pageToken=page.nextPageToken||'';
            } while(pageToken);
          } catch (error) {
            listFailure={status:error.status||null,body:error.body||null,message:error.message};
            extractionMode='runQuery';
            const statuses=['Aguardando Andamento','Tramitado','Para assinatura','Sobrestado','Ajustar','Encerrado','Aguardando andamento','tramitação','tramitado','sobrestado','ajustar','encerrado'];
            const queryBody={structuredQuery:{
              from:[{collectionId:'demandasrj2'}],
              where:{fieldFilter:{field:{fieldPath:'status'},op:'IN',value:{arrayValue:{values:statuses.map(stringValue=>({stringValue}))}}}}
            }};
            const rows=await jsonFetch(`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/demandas/registros:runQuery`,{
              method:'POST',headers,body:JSON.stringify(queryBody)
            });
            rawDocuments=rows.map(row=>row.document).filter(Boolean);
          }

          function decodeValue(value) {
            if(!value || typeof value!=='object') return value;
            if('nullValue' in value) return null;
            if('stringValue' in value) return value.stringValue;
            if('booleanValue' in value) return value.booleanValue;
            if('integerValue' in value) {
              const n=Number(value.integerValue);
              return Number.isSafeInteger(n) ? n : value.integerValue;
            }
            if('doubleValue' in value) return value.doubleValue;
            if('timestampValue' in value) return value.timestampValue;
            if('bytesValue' in value) return {$bytes:value.bytesValue};
            if('referenceValue' in value) return {$reference:value.referenceValue};
            if('geoPointValue' in value) return {$geoPoint:value.geoPointValue};
            if('arrayValue' in value) return (value.arrayValue.values||[]).map(decodeValue);
            if('mapValue' in value) return decodeFields(value.mapValue.fields||{});
            return value;
          }
          function decodeFields(fields) {
            return Object.fromEntries(Object.entries(fields||{}).map(([key,value])=>[key,decodeValue(value)]));
          }
          function documentId(name='') { return name.split('/').pop()||''; }
          const documents=rawDocuments.map(doc=>({
            _firestoreDocumentId:documentId(doc.name),
            _firestoreName:doc.name,
            _createTime:doc.createTime||null,
            _updateTime:doc.updateTime||null,
            ...decodeFields(doc.fields||{})
          }));
          documents.sort((a,b)=>String(a._firestoreDocumentId).localeCompare(String(b._firestoreDocumentId),'pt-BR'));

          const fieldFrequency={};
          for(const doc of documents) for(const key of Object.keys(doc)) fieldFrequency[key]=(fieldFrequency[key]||0)+1;
          const canonical=JSON.stringify(documents);
          const manifest={
            extractedAt:new Date().toISOString(),
            projectId,
            collectionPath:'demandas/registros/demandasrj2',
            extractionMode,
            listFailure,
            authenticatedUid:auth.localId,
            documentCount:documents.length,
            sha256:crypto.createHash('sha256').update(canonical).digest('hex'),
            fieldFrequency:Object.fromEntries(Object.entries(fieldFrequency).sort((a,b)=>a[0].localeCompare(b[0],'pt-BR')))
          };
          await fs.writeFile('legacy-demand-export/demandas-firestore-raw.json',JSON.stringify(rawDocuments,null,2));
          await fs.writeFile('legacy-demand-export/demandas-legado.json',JSON.stringify(documents,null,2));
          await fs.writeFile('legacy-demand-export/manifest.json',JSON.stringify(manifest,null,2));
          JS
          node legacy-demand-export/export.mjs

      - name: Upload export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-readable-demands
          path: legacy-demand-export
          retention-days: 1
          if-no-files-found: error
