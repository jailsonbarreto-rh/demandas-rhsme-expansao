name: Audit legacy system artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-legacy-pr.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Capture HTTP, browser and bundle evidence
        shell: bash
        run: |
          mkdir -p legacy-audit/http legacy-audit/browser legacy-audit/assets
          cat > legacy-audit-runner.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const root='legacy-audit';
          const base='https://rh-sme.web.app/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:'pt-BR'});
          const page=await context.newPage();
          const requests=[]; const responses=[]; const consoleEvents=[]; const pageErrors=[];
          page.on('request',r=>requests.push({url:r.url(),method:r.method(),resourceType:r.resourceType(),headers:r.headers()}));
          page.on('response',async r=>responses.push({url:r.url(),status:r.status(),statusText:r.statusText(),headers:await r.allHeaders()}));
          page.on('console',m=>consoleEvents.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));
          await page.goto(base,{waitUntil:'networkidle',timeout:90000});
          await page.screenshot({path:`${root}/browser/login-full.png`,fullPage:true});
          await fs.writeFile(`${root}/browser/rendered.html`,await page.content());
          const dom=await page.evaluate(()=>({
            title:document.title,url:location.href,text:document.body?.innerText||'',
            scripts:[...document.scripts].map(s=>({src:s.src,type:s.type,async:s.async,defer:s.defer})),
            stylesheets:[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href),
            links:[...document.querySelectorAll('a')].map(a=>({text:(a.innerText||'').trim(),href:a.href,target:a.target})),
            buttons:[...document.querySelectorAll('button,[role="button"]')].map((b,i)=>({i,text:(b.innerText||b.getAttribute('aria-label')||'').trim(),type:b.getAttribute('type'),disabled:b.disabled,ariaLabel:b.getAttribute('aria-label')})),
            inputs:[...document.querySelectorAll('input,select,textarea')].map((e,i)=>({i,tag:e.tagName,type:e.type,name:e.name,id:e.id,placeholder:e.placeholder,autocomplete:e.autocomplete,required:e.required,ariaLabel:e.getAttribute('aria-label')})),
            forms:[...document.forms].map((f,i)=>({i,action:f.action,method:f.method,autocomplete:f.autocomplete})),
            localStorage:Object.fromEntries(Object.entries(localStorage)),sessionStorage:Object.fromEntries(Object.entries(sessionStorage)),cookies:document.cookie,
            meta:[...document.querySelectorAll('meta')].map(m=>({name:m.name,httpEquiv:m.httpEquiv,content:m.content})),
            rootChildren:[...document.querySelectorAll('#root > *')].map(e=>({tag:e.tagName,className:e.className,id:e.id})),
            globals:Object.keys(window).filter(k=>/firebase|expo|webpack|metro|react/i.test(k)).sort()
          }));
          for (const [name,data] of Object.entries({dom,requests,responses,consoleEvents,pageErrors})) await fs.writeFile(`${root}/browser/${name}.json`,JSON.stringify(data,null,2));
          await fs.writeFile(`${root}/browser/storage-state.json`,JSON.stringify(await context.storageState(),null,2));

          const urls=new Set([base,`${base}asset-manifest.json`,`${base}manifest.json`,`${base}robots.txt`,`${base}service-worker.js`,`${base}firebase-messaging-sw.js`]);
          for(const r of responses){try{const u=new URL(r.url);if(u.hostname==='rh-sme.web.app')urls.add(u.href)}catch{}}
          for(const s of dom.scripts) if(s.src) urls.add(s.src);
          for(const s of dom.stylesheets) if(s) urls.add(s);
          const inventory=[];
          for(const url of [...urls].sort()){
            const res=await context.request.get(url,{timeout:60000,failOnStatusCode:false});
            const body=await res.body();
            const u=new URL(url); let logical=u.pathname.replace(/^\//,'')||'index.html';
            if(u.search) logical+=`__q_${crypto.createHash('sha256').update(u.search).digest('hex').slice(0,12)}`;
            const target=path.join(root,'assets',logical); await fs.mkdir(path.dirname(target),{recursive:true}); await fs.writeFile(target,body);
            await fs.writeFile(`${target}.headers.json`,JSON.stringify(res.headers(),null,2));
            inventory.push({url,status:res.status(),path:target.replace(`${root}/`,''),bytes:body.length,sha256:crypto.createHash('sha256').update(body).digest('hex'),contentType:res.headers()['content-type']||''});
          }
          await fs.writeFile(`${root}/inventory.json`,JSON.stringify(inventory,null,2));
          await browser.close();
          JS
          node legacy-audit-runner.mjs

      - name: Analyze JavaScript signatures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('legacy-audit')
          needles={
            'react':['useState','useEffect','createElement','react.production.min'],
            'react_native_web':['react-native-web','r-backgroundColor','r-flexDirection','createDOMProps'],
            'expo':['expo-modules-core','Exponent','expo-asset','expo-font'],
            'metro':['metroRequire','__d(','__r('],
            'webpack':['__webpack_require__','webpackChunk','webpackJsonp'],
            'firebase':['initializeApp','getFirestore','signInWithEmailAndPassword','firebaseapp.com','firebasestorage'],
            'firestore':['getFirestore','collection','getDocs','setDoc','updateDoc','onSnapshot'],
            'firebase_auth':['getAuth','signInWithEmailAndPassword','createUserWithEmailAndPassword','onAuthStateChanged'],
            'firebase_storage':['getStorage','uploadBytes','getDownloadURL'],
            'xlsx':['XLSX','SheetJS','book_new','sheet_to_json'],
            'jspdf':['jsPDF','jspdf'],
            'html2canvas':['html2canvas'],
            'emotion':['@emotion','emotion-cache','data-emotion'],
            'react_navigation':['@react-navigation','NavigationContainer','createStackNavigator'],
            'date_fns':['date-fns','formatDistance','parseISO'],
            'moment':['moment.locale','moment.utc'],
          }
          findings={}; maps=[]
          for f in (root/'assets').rglob('*'):
            if not f.is_file() or f.name.endswith(('.json','.png','.ico')): continue
            text=f.read_text('utf-8',errors='ignore')
            for family,terms in needles.items():
              hits=[t for t in terms if t in text]
              if hits: findings.setdefault(family,[]).append({'file':str(f.relative_to(root)),'hits':hits})
            refs=re.findall(r'sourceMappingURL=([^\s*]+)',text)
            if refs: maps.append({'file':str(f.relative_to(root)),'refs':refs})
          (root/'signature-findings.json').write_text(json.dumps(findings,indent=2),encoding='utf-8')
          (root/'source-map-references.json').write_text(json.dumps(maps,indent=2),encoding='utf-8')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: legacy-system-public-evidence
          path: legacy-audit
          retention-days: 3
          if-no-files-found: error
