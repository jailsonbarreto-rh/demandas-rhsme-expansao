name: Bootstrap modernization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-verify:
    if: contains(github.event.head_commit.message, '[run-modernization]')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: modernizacao/segura-2026
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update compatible dependencies
        run: |
          npm install --save-exact react@latest react-dom@latest @supabase/supabase-js@latest
          npm install --save-dev --save-exact \
            @testing-library/jest-dom@latest \
            @testing-library/react@latest \
            @testing-library/user-event@latest \
            @types/node@latest \
            @types/react@latest \
            @types/react-dom@latest \
            @vitejs/plugin-react@latest \
            jsdom@latest \
            typescript@5.9.3 \
            vite@latest \
            vitest@latest \
            @playwright/test@latest \
            supabase@latest

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit and integration tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build

      - name: Commit validated dependency set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: atualizar dependências validadas"
          git push origin HEAD:modernizacao/segura-2026
