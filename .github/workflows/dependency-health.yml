name: Dependency health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-type-aware-lint:
    name: Apply scoped type-aware lint changes
    if: github.event.pull_request.head.ref == 'quality/type-aware-lint' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: quality/type-aware-lint
          fetch-depth: 0

      - name: Apply configuration and promise handling
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const eslintConfig = `import js from '@eslint/js';
          import jsxA11y from 'eslint-plugin-jsx-a11y';
          import reactHooks from 'eslint-plugin-react-hooks';
          import globals from 'globals';
          import tseslint from 'typescript-eslint';

          const typedSourceFiles = ['src/**/*.{ts,tsx}'];
          const typedSourceConfigs = tseslint.configs.recommendedTypeChecked.map((config) => ({
            ...config,
            files: typedSourceFiles,
          }));

          export default tseslint.config(
            {
              ignores: [
                'coverage/**',
                'dist/**',
                'node_modules/**',
                'playwright-report/**',
                'test-results/**',
                '.migration/**',
              ],
            },
            {
              ...js.configs.recommended,
              files: ['**/*.{js,mjs,cjs}'],
              languageOptions: {
                ecmaVersion: 'latest',
                sourceType: 'module',
                globals: globals.nodeBuiltin,
              },
            },
            ...tseslint.configs.recommended,
            ...typedSourceConfigs,
            {
              files: ['**/*.{ts,tsx}'],
              languageOptions: {
                globals: {
                  ...globals.browser,
                  ...globals.nodeBuiltin,
                },
              },
              rules: {
                'no-undef': 'off',
                '@typescript-eslint/no-explicit-any': 'off',
                '@typescript-eslint/no-unused-vars': ['error', {
                  argsIgnorePattern: '^_',
                  caughtErrorsIgnorePattern: '^_',
                  varsIgnorePattern: '^_',
                }],
              },
            },
            {
              files: typedSourceFiles,
              languageOptions: {
                parserOptions: {
                  projectService: true,
                  tsconfigRootDir: import.meta.dirname,
                },
              },
              rules: {
                '@typescript-eslint/no-floating-promises': 'error',
                '@typescript-eslint/no-misused-promises': 'error',
                '@typescript-eslint/no-unsafe-argument': 'off',
                '@typescript-eslint/no-unsafe-assignment': 'off',
                '@typescript-eslint/no-unsafe-call': 'off',
                '@typescript-eslint/no-unsafe-member-access': 'off',
                '@typescript-eslint/no-unsafe-return': 'off',
                '@typescript-eslint/no-base-to-string': 'off',
                '@typescript-eslint/no-unnecessary-type-assertion': 'off',
                '@typescript-eslint/no-redundant-type-constituents': 'off',
                '@typescript-eslint/require-await': 'off',
                '@typescript-eslint/only-throw-error': 'off',
              },
            },
            {
              files: ['src/**/*.{ts,tsx}'],
              plugins: {
                'jsx-a11y': jsxA11y,
                'react-hooks': reactHooks,
              },
              rules: {
                ...jsxA11y.flatConfigs.recommended.rules,
                'jsx-a11y/no-noninteractive-tabindex': ['error', { roles: ['region'] }],
                'react-hooks/rules-of-hooks': 'error',
                'react-hooks/exhaustive-deps': 'error',
              },
            },
            {
              files: ['**/*.test.{ts,tsx,js,mjs}'],
              rules: {
                '@typescript-eslint/no-empty-function': 'off',
              },
            },
          );
          `;
          fs.writeFileSync('eslint.config.mjs', eslintConfig.replace(/^          /gm, ''));

          const appPath = 'src/App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          const navigateMatches = app.match(/(?<!void )(?<!await )navigate\(/g) ?? [];
          if (navigateMatches.length !== 8) {
            throw new Error(`Esperadas 8 chamadas de navigate sem tratamento; encontradas ${navigateMatches.length}.`);
          }
          app = app.replace(/(?<!void )(?<!await )navigate\(/g, 'void navigate(');

          if (!app.includes('onLogout={handleLogout}') || !app.includes('onExportExcel={handleExportExcel}')) {
            throw new Error('Handlers assíncronos esperados no Header não foram encontrados.');
          }
          app = app
            .replace('onLogout={handleLogout}', 'onLogout={() => { void handleLogout(); }}')
            .replace('onExportExcel={handleExportExcel}', 'onExportExcel={() => { void handleExportExcel(); }}');
          fs.writeFileSync(appPath, app);

          fs.mkdirSync('docs/maintenance', { recursive: true });
          fs.writeFileSync('docs/maintenance/TYPE_AWARE_LINT_2026-07-28.md', `# Lint tipado — 28 de julho de 2026

## Escopo ativado

A análise com informação de tipos foi ativada para o código-fonte em \`src/**/*.{ts,tsx}\`, usando:

- \`typescript-eslint.configs.recommendedTypeChecked\`;
- \`parserOptions.projectService\`;
- \`@typescript-eslint/no-floating-promises\` como erro;
- \`@typescript-eslint/no-misused-promises\` como erro.

Os arquivos TypeScript operacionais fora de \`src\` permanecem sob o preset recomendado sem informação de tipos. Essa delimitação acompanha o \`tsconfig.json\` atual, cujo escopo compilável é \`src\`.

## Achados corrigidos

O primeiro gate tipado identificou oito promessas de navegação sem tratamento explícito e dois handlers assíncronos fornecidos a atributos que esperavam retorno \`void\`. As chamadas intencionalmente não aguardadas passaram a usar \`void\`, e os handlers do cabeçalho receberam adaptadores síncronos explícitos.

## Adoção progressiva

O preset tipado também revelou famílias preexistentes de achados em mapeadores locais, exportação Excel e dublês de teste. As regras \`no-unsafe-*\`, \`no-base-to-string\`, \`no-unnecessary-type-assertion\`, \`no-redundant-type-constituents\`, \`require-await\` e \`only-throw-error\` permanecem explicitamente fora deste PR para evitar uma refatoração funcional ampla sem plano próprio.

Essa delimitação não reduz nem desativa as duas regras de promessas que motivaram o pacote.
`);
          NODE

      - name: Restore CI definition and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/dependency-health.yml
          rm -f .github/workflows/apply-type-aware-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eslint.config.mjs src/App.tsx docs/maintenance/TYPE_AWARE_LINT_2026-07-28.md .github/workflows/dependency-health.yml .github/workflows/apply-type-aware-lint.yml
          git commit -m 'chore(lint): corrigir promessas e delimitar lint tipado'
          git push origin HEAD:quality/type-aware-lint

  audit-test-build-browser:
    name: Audit, lint, coverage, build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit-report.txt

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static analysis
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-report.txt

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit, integration and coverage checks
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-coverage-report.txt

      - name: Upload test execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-report.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: build-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce initial bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-test-report.txt

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            browser-test-report.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
