name: Dependency health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-type-aware-lint:
    name: Apply scoped type-aware lint changes
    if: github.event.pull_request.head.ref == 'quality/type-aware-lint' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: quality/type-aware-lint
          fetch-depth: 0

      - name: Apply deterministic changes
        run: node scripts/apply-type-aware-lint.mjs

      - name: Restore CI definition and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/dependency-health.yml
          rm -f .github/workflows/apply-type-aware-lint.yml scripts/apply-type-aware-lint.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eslint.config.mjs src/App.tsx docs/maintenance/TYPE_AWARE_LINT_2026-07-28.md .github/workflows/dependency-health.yml .github/workflows/apply-type-aware-lint.yml scripts/apply-type-aware-lint.mjs
          git commit -m 'chore(lint): corrigir promessas e delimitar lint tipado'
          git push origin HEAD:quality/type-aware-lint

  audit-test-build-browser:
    name: Audit, lint, coverage, build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit-report.txt

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static analysis
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-report.txt

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit, integration and coverage checks
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-coverage-report.txt

      - name: Upload test execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-report.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: build-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce initial bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-test-report.txt

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            browser-test-report.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
