name: Apply validated functional modernization v2

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-test-and-consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: modernizacao/funcional-2026-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply, validate and create one consolidated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if bash .github/scripts/apply-modernization-v2.sh 2>&1 | tee /tmp/modernization.log; then
            gh pr comment 9 --body "Modernização v2 aplicada e validada: auditoria, testes, build e Chromium desktop/mobile concluídos. O commit funcional foi consolidado na branch."
          else
            tail -n 120 /tmp/modernization.log > /tmp/modernization-tail.log
            {
              echo 'Falha na execução consolidada da modernização v2.'
              echo
              echo '```text'
              cat /tmp/modernization-tail.log
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment 9 --body-file /tmp/pr-comment.md
            exit 1
          fi

# Gatilho único registrado após a ativação do evento push.
