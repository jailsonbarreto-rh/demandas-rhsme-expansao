name: Apply validated functional modernization v2

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-and-consolidate:
    if: >-
      github.event.pull_request.head.ref == 'modernizacao/funcional-2026-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: modernizacao/funcional-2026-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply, validate and create one consolidated commit
        run: bash .github/scripts/apply-modernization-v2.sh
