name: Dependency health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-test-build-browser:
    name: Audit, lint, coverage, build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static analysis
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-report.txt

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit, integration and coverage checks
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-coverage-report.txt

      - name: Upload test execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-report.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: build-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce initial bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-test-report.txt

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            browser-test-report.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  cycle3-supabase-local:
    name: Cycle 3 migration in ephemeral Supabase
    if: github.head_ref == 'feat/expandir-modelo-central-trabalho-ciclo-3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CYCLE3_MIGRATION: supabase/migrations/20260722090000_central_trabalho_expand.sql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Start baseline database without Cycle 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle3-migration
          mv "$CYCLE3_MIGRATION" /tmp/cycle3-migration/
          supabase db start

      - name: Insert synthetic legacy fixture
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle3_legacy_fixture.sql

      - name: Apply Cycle 3 migration over legacy data
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/cycle3-migration/20260722090000_central_trabalho_expand.sql "$CYCLE3_MIGRATION"
          supabase migration up --local

      - name: Validate backfill, constraints and legacy RPC compatibility
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle3_invariants.sql

      - name: Replay complete migration chain from scratch
        run: supabase db reset --local --no-seed

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
