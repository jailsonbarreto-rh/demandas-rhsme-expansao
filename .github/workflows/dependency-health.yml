name: Dependency health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-test-build-browser:
    name: Audit, lint, coverage, build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic source corrections
        shell: python
        run: |
          from pathlib import Path

          app_test = Path('src/App.supabase.test.tsx')
          app_source = app_test.read_text(encoding='utf-8')
          old_label = "'Ver todas as demandas'"
          if app_source.count(old_label) != 3:
              raise SystemExit('Quantidade inesperada de referências ao rótulo antigo nos testes.')
          app_test.write_text(
              app_source.replace(old_label, "'Demandas Equipe CTRH'"),
              encoding='utf-8',
          )

          filter_panel = Path('src/components/FilterPanel.tsx')
          filter_source = filter_panel.read_text(encoding='utf-8')
          old_spacing = '''<span className="badge-count">{filtrosAtivosCount}</span>
              <strong>'''
          new_spacing = '''<span className="badge-count">{filtrosAtivosCount}</span>
              {' '}
              <strong>'''
          if filter_source.count(old_spacing) != 1:
              raise SystemExit('Estrutura inesperada no resumo de filtros.')
          filter_panel.write_text(
              filter_source.replace(old_spacing, new_spacing),
              encoding='utf-8',
          )

      - name: Regenerate lockfile for dependency overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit corrected sources and lockfile
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Arquivos já estão sincronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.supabase.test.tsx src/components/FilterPanel.tsx package-lock.json
          git commit -m "test: alinhar regressões ao refinamento do R3"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit-report.txt

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static analysis
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-report.txt

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit, integration and coverage checks
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-coverage-report.txt

      - name: Upload test execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-report.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: build-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce initial bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-test-report.txt

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            browser-test-report.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
