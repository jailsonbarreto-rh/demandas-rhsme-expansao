name: Fix transitive audit in latest experiment

on:
  push:
    branches:
      - experiment/latest-except-toolchain-majors-20260903

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/latest-except-toolchain-majors-20260903
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install locked tree
        run: npm ci
      - name: Apply non-forced transitive audit fix
        run: npm audit fix
      - name: Confirm high severity audit is clean
        run: npm audit --audit-level=high
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: atualizar browserslist transitivo vulnerável"
          git push origin HEAD:experiment/latest-except-toolchain-majors-20260903