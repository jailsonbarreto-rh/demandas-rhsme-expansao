name: Export current source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -r current-source.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'dist/*' \
            -x 'playwright-report/*' \
            -x 'test-results/*'
      - uses: actions/upload-artifact@v4
        with:
          name: current-source
          path: current-source.zip
          retention-days: 1
