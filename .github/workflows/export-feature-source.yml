name: Apply validated Excel export

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect transfer package
        id: guard
        shell: bash
        run: |
          if [[ -f .github/excel-transfer/patches.b64 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Transfer package already applied; nothing to do."
          fi

      - name: Reconstruct and verify patches
        if: steps.guard.outputs.exists == 'true'
        shell: bash
        run: |
          base64 --decode .github/excel-transfer/patches.b64 > /tmp/export-excel-patches.xz
          echo "a69bdea816331f58501d3fce87918fcc6c2a7a596f97bf198c61538ebc4bc7e6  /tmp/export-excel-patches.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/export-excel-patches.xz > /tmp/export-excel-patches.mbox

      - name: Apply documented implementation
        if: steps.guard.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way /tmp/export-excel-patches.mbox

      - name: Set up Node.js
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.guard.outputs.exists == 'true'
        run: npm ci

      - name: Audit dependencies
        if: steps.guard.outputs.exists == 'true'
        run: npm audit --audit-level=high

      - name: Run unit and integration tests
        if: steps.guard.outputs.exists == 'true'
        run: npm test

      - name: Build production bundle
        if: steps.guard.outputs.exists == 'true'
        run: npm run build

      - name: Enforce initial bundle budget
        if: steps.guard.outputs.exists == 'true'
        run: npm run check:bundle

      - name: Install Chromium
        if: steps.guard.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        if: steps.guard.outputs.exists == 'true'
        run: npm run test:e2e

      - name: Remove transfer payload and publish validated commits
        if: steps.guard.outputs.exists == 'true'
        shell: bash
        run: |
          git rm .github/excel-transfer/patches.b64
          git commit -m "chore: remover artefato de transferência"
          git push origin HEAD:feat/exportacao-excel-analitica
