name: Export source temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    name: Export source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: zip -r source-snapshot.zip . -x '.git/*' 'node_modules/*' 'dist/*' 'playwright-report/*' 'test-results/*'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 1
