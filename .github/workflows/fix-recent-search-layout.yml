name: Fix recent search layout

on:
  push:
    branches:
      - feat/busca-avancada-20260720

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/busca-avancada-20260720
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply verified layout fix
        run: |
          node scripts/fix-recent-search-layout.mjs
          git diff --check
      - name: Commit layout fix
        run: |
          if git diff --quiet; then
            echo "Layout já corrigido."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git commit -m "fix: impedir sobreposição das buscas recentes"
          git push origin HEAD:feat/busca-avancada-20260720
