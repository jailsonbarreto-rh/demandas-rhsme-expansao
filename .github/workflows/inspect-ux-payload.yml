name: Inspect UX payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect payloads
        shell: bash
        run: |
          mkdir -p /tmp/ux-payload
          {
            echo 'OLD PARTS'
            wc -c .github/ux-patches/patches.part.* || true
            cat .github/ux-patches/patches.part.* > /tmp/ux-payload/old.b64
            base64 --decode /tmp/ux-payload/old.b64 > /tmp/ux-payload/old.xz
            echo "old_decode_exit=$?"
            xz --test /tmp/ux-payload/old.xz
            echo "old_xz_exit=$?"
            sha256sum /tmp/ux-payload/old.xz || true
            echo 'NEW PARTS'
            wc -c .github/ux-transfer/payload.part.* || true
            cat .github/ux-transfer/payload.part.* > /tmp/ux-payload/new-partial.b64
            base64 --decode /tmp/ux-payload/new-partial.b64 > /tmp/ux-payload/new-partial.xz
            echo "new_decode_exit=$?"
            xz --test /tmp/ux-payload/new-partial.xz
            echo "new_xz_exit=$?"
            sha256sum /tmp/ux-payload/new-partial.xz || true
          } 2>&1 | tee /tmp/ux-payload/report.txt
          exit 0

      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-payload-inspection
          path: /tmp/ux-payload
          retention-days: 1
