name: Maintenance lockfile bootstrap 2026-08-29

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/maintenance-lockfile-bootstrap-20260829.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-lockfile:
    if: github.event.pull_request.head.ref == 'chore/maintenance-safe-updates-20260829'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify manifest and diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git diff --check

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: sincronizar lockfile da manutenção'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install exact dependency tree
        run: npm ci

      - name: Reject high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Validate dependency compatibility
        run: npm run test:dependency-compat

      - name: Validate lint
        run: npm run lint

      - name: Validate unit and integration tests
        run: npm test

      - name: Validate production build
        run: npm run build

      - name: Validate bundle budgets
        run: npm run check:bundle

      - name: Validate public bundle
        run: npm run check:public-bundle
