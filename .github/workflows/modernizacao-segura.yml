name: Preparar modernização segura

on:
  push:
    branches:
      - modernizacao/segura-2026

permissions:
  contents: write

jobs:
  modernize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernizacao/segura-2026
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply safe source and tooling improvements
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.engines = { node: '24.x' };
          packageJson.scripts = {
            ...packageJson.scripts,
            'test:e2e': 'playwright test',
            'test:e2e:ui': 'playwright test --ui',
            'types:supabase': 'supabase gen types typescript --project-id kdhekkzwcokfrpcrsllr --schema public > src/lib/database.types.ts',
            'check': 'npm audit --audit-level=high && npm test && npm run build',
            'check:full': 'npm run check && npm run test:e2e'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          printf '24\n' > .nvmrc

          mkdir -p .github
          cat > .github/dependabot.yml <<'EOF'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: "09:00"
                timezone: America/Sao_Paulo
              open-pull-requests-limit: 5
              groups:
                production-minor-patch:
                  patterns:
                    - react
                    - react-dom
                    - "@supabase/*"
                  update-types:
                    - minor
                    - patch
                development-minor-patch:
                  dependency-type: development
                  update-types:
                    - minor
                    - patch

            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: "09:30"
                timezone: America/Sao_Paulo
              open-pull-requests-limit: 3
          EOF

          cat > src/lib/supabase.ts <<'EOF'
          import { createClient, type SupabaseClient } from '@supabase/supabase-js';
          import type { AppConfig } from '../config/appConfig';
          import type { Database } from './database.types';

          export type SupabaseAppConfig = Extract<AppConfig, { mode: 'supabase' }>;

          let client: SupabaseClient<Database> | undefined;

          export function getSupabaseClient(config: SupabaseAppConfig): SupabaseClient<Database> {
            client ??= createClient<Database>(config.supabaseUrl, config.supabasePublishableKey);
            return client;
          }
          EOF

          cat > src/services/createAppServices.ts <<'EOF'
          import type { AppConfig } from '../config/appConfig';
          import { initialDemandas } from '../data/initialDemandas';
          import { getSupabaseClient } from '../lib/supabase';
          import type { AuthService, DemandasRepository, ProfilesService } from './contracts';
          import { LocalAuthService } from './localAuthService';
          import { LocalDemandasRepository } from './localDemandasRepository';
          import { SupabaseAuthService } from './supabaseAuthService';
          import { SupabaseDemandasRepository } from './supabaseDemandasRepository';
          import { SupabaseProfilesService } from './supabaseProfilesService';

          export interface AppServices {
            mode: 'local' | 'supabase';
            auth: AuthService;
            demandas: DemandasRepository;
            profiles: ProfilesService;
          }

          export class ConfigurationError extends Error {
            constructor(message: string) {
              super(message);
              this.name = 'ConfigurationError';
            }
          }

          const localProfilesService: ProfilesService = {
            list: async () => [],
            updateAccess: async () => undefined,
          };

          export function createAppServices(config: AppConfig, storage: Storage = window.localStorage): AppServices {
            if (config.mode === 'invalid') throw new ConfigurationError(config.message);
            if (config.mode === 'local') {
              return {
                mode: 'local',
                auth: new LocalAuthService(storage),
                demandas: new LocalDemandasRepository(storage, initialDemandas),
                profiles: localProfilesService,
              };
            }

            const client = getSupabaseClient(config);
            return {
              mode: 'supabase',
              auth: new SupabaseAuthService(client),
              demandas: new SupabaseDemandasRepository(client),
              profiles: new SupabaseProfilesService(client),
            };
          }
          EOF

          cat > playwright.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './tests/e2e',
            fullyParallel: false,
            forbidOnly: Boolean(process.env.CI),
            retries: process.env.CI ? 1 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: process.env.CI
              ? [['list'], ['html', { outputFolder: 'playwright-report', open: 'never' }]]
              : 'list',
            use: {
              baseURL: 'http://127.0.0.1:4173',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
            projects: [
              {
                name: 'chromium-desktop',
                use: { ...devices['Desktop Chrome'] },
              },
              {
                name: 'chromium-mobile',
                use: { ...devices['Pixel 7'] },
              },
            ],
            webServer: {
              command: 'npm run dev -- --host 127.0.0.1 --port 4173',
              url: 'http://127.0.0.1:4173',
              reuseExistingServer: !process.env.CI,
              timeout: 120_000,
              env: {
                ...process.env,
                VITE_APP_MODE: 'local',
              },
            },
          });
          EOF

          mkdir -p tests/e2e
          cat > tests/e2e/smoke.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          test('login e fluxo de edição respondem sem erros no navegador', async ({ page }) => {
            const consoleErrors: string[] = [];
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            await page.goto('/');
            await expect(page).toHaveTitle(/Central de Demandas/i);
            await expect(page.getByRole('button', { name: /acessar sistema/i })).toBeVisible();

            await page.getByPlaceholder('usuario@rioeduca.net').fill('teste@rioeduca.net');
            await page.getByPlaceholder('••••••••').first().fill('senha-local-teste');
            await page.getByRole('button', { name: /acessar sistema/i }).click();

            await expect(page.getByRole('button', { name: /sair/i })).toBeVisible();
            await page.getByRole('button', { name: /^demandas$/i }).click();
            await page.getByRole('button', { name: /^abrir$/i }).first().click();

            await expect(page.getByRole('heading', { name: /processo nº/i })).toBeVisible();
            await page.getByRole('button', { name: /^editar$/i }).click();
            await expect(page.getByRole('heading', { name: /editar dados da demanda/i })).toBeVisible();
            await page.getByRole('button', { name: /^cancelar$/i }).click();
            await page.getByRole('button', { name: /^fechar$/i }).click();

            expect(consoleErrors).toEqual([]);
          });
          EOF

          cat > .github/workflows/dependency-health.yml <<'EOF'
          name: Dependency health

          on:
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            audit-test-build:
              name: Audit, test and build
              runs-on: ubuntu-latest
              timeout-minutes: 25

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Set up Node.js 24
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm

                - name: Install locked dependencies
                  run: npm ci

                - name: Audit dependencies
                  run: npm audit --audit-level=high

                - name: Run unit and integration tests
                  run: npm test

                - name: Install Chromium for browser tests
                  run: npx playwright install --with-deps chromium

                - name: Run browser smoke tests
                  run: npm run test:e2e

                - name: Build production bundle
                  run: npm run build
          EOF

          mkdir -p docs/superpowers/plans
          cat > docs/superpowers/plans/2026-07-13-safe-modernization.md <<'EOF'
          # Safe Modernization Implementation Plan

          > **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:executing-plans to implement this plan task-by-task.

          **Goal:** Modernize the React, Vite, Supabase and test toolchain without changing production data or accepting an update that fails audit, automated tests, browser smoke tests or the production build.

          **Architecture:** Keep the current Vite SPA and Supabase service boundaries. Improve type safety at the client factory, add deterministic browser testing in local mode, pin Node 24, automate dependency maintenance and regenerate the npm lockfile only after the full verification pipeline passes.

          **Tech Stack:** React 19, Vite, TypeScript 5.9, Supabase JS, Vitest, Playwright, GitHub Actions and Dependabot.

          ## Global Constraints

          - Do not migrate to TypeScript 7 in this change set.
          - Do not alter Supabase tables, RLS policies, users or production data.
          - Do not merge unless npm audit, unit tests, browser tests and build all pass.
          - Keep VITE_APP_MODE=local for deterministic browser tests.

          ---

          ### Task 1: Runtime and dependency baseline

          **Files:** `package.json`, `package-lock.json`, `.nvmrc`, `.github/dependabot.yml`

          - [x] Pin Node 24 and add repeatable verification scripts.
          - [x] Update compatible runtime and development dependencies.
          - [x] Add weekly npm and GitHub Actions maintenance.

          ### Task 2: Typed Supabase client

          **Files:** `src/lib/supabase.ts`, `src/services/createAppServices.ts`

          - [x] Instantiate `createClient<Database>` directly.
          - [x] Remove the unsafe `as SupabaseClient<Database>` cast.
          - [x] Preserve the existing singleton client and service contracts.

          ### Task 3: Browser-level QA

          **Files:** `playwright.config.ts`, `tests/e2e/smoke.spec.ts`, `.github/workflows/dependency-health.yml`

          - [x] Test desktop and mobile Chromium profiles.
          - [x] Exercise login, demand opening and the edit modal.
          - [x] Fail on browser console errors.
          - [x] Run the browser smoke test in pull-request CI.

          ### Task 4: Verification gate

          - [x] Run `npm audit --audit-level=high`.
          - [x] Run `npm test`.
          - [x] Run `npm run test:e2e`.
          - [x] Run `npm run build`.
          - [x] Commit only after every command succeeds.
          EOF

      - name: Update compatible dependencies and regenerate lockfile
        shell: bash
        run: |
          npm install --save-exact \
            react@latest \
            react-dom@latest \
            @supabase/supabase-js@latest

          npm install --save-dev --save-exact \
            @testing-library/jest-dom@latest \
            @testing-library/react@latest \
            @testing-library/user-event@latest \
            @types/node@latest \
            @types/react@latest \
            @types/react-dom@latest \
            @vitejs/plugin-react@latest \
            jsdom@latest \
            typescript@5.9.3 \
            vite@latest \
            vitest@latest \
            @playwright/test@latest \
            supabase@latest

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit and integration tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build

      - name: Commit verified modernization
        shell: bash
        run: |
          rm .github/workflows/modernizacao-segura.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: modernizar dependências e testes com validação completa"
          git push origin HEAD:modernizacao/segura-2026
