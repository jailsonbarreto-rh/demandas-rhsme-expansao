name: Normalizar formatação do hotfix Excel

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - fix/exportacao-excel-compativel
    paths:
      - .github/workflows/normalize-excel-fix-format.yml

permissions:
  contents: write

jobs:
  normalizar:
    if: github.event_name == 'push' || github.head_ref == 'fix/exportacao-excel-compativel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exportacao-excel-compativel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Corrigir recuo do bloco
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/export/exportDemandasExcel.ts')
          source = path.read_text(encoding='utf-8')
          old = '''  const headers = [
          'ID',
          'Número',
          'Tipo',
          'Assunto',
          'Responsável',
          'Limite 1',
          'Limite 2',
          'Status',
          'Setor',
          'Classificação',
          'Situação do prazo',
          'Dias até o prazo',
        ];
      worksheet.getRow(8).values = headers;
      rows.forEach((values, index) => {
        worksheet.getRow(9 + index).values = values;
      });'''
          new = '''  const headers = [
            'ID',
            'Número',
            'Tipo',
            'Assunto',
            'Responsável',
            'Limite 1',
            'Limite 2',
            'Status',
            'Setor',
            'Classificação',
            'Situação do prazo',
            'Dias até o prazo',
          ];
          worksheet.getRow(8).values = headers;
          rows.forEach((values, index) => {
            worksheet.getRow(9 + index).values = values;
          });'''
          old = '\n'.join(line[6:] if line.startswith('      ') else line for line in old.splitlines())
          new = '\n'.join(line[6:] if line.startswith('      ') else line for line in new.splitlines())
          if source.count(old) != 1:
              raise RuntimeError('Bloco esperado não encontrado de forma unívoca.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - run: npm ci
      - run: npx vitest run src/export/exportDemandasExcel.test.ts
      - run: npm run build

      - name: Commitar e limpar mecanismo temporário
        run: |
          rm .github/workflows/normalize-excel-fix-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export/exportDemandasExcel.ts .github/workflows/normalize-excel-fix-format.yml
          git commit -m "style: normalizar bloco da exportação Excel"
          git push origin HEAD:fix/exportacao-excel-compativel
