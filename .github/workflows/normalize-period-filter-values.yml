name: Normalize period filter values

on:
  push:
    branches:
      - feat/busca-avancada-20260720

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/busca-avancada-20260720
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply compatibility patch
        run: |
          node scripts/normalize-period-filter-values.mjs
          git diff --check
      - name: Commit compatibility patch
        run: |
          if git diff --quiet; then
            echo "Compatibilidade já aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FilterPanel.tsx
          git commit -m "fix: manter filtros de período sempre controlados"
          git push origin HEAD:feat/busca-avancada-20260720
