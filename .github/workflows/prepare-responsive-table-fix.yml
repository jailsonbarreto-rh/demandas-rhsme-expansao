name: Prepare responsive demand table fix

on:
  push:
    branches:
      - fix/tabela-responsiva-largura-fluida

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tabela-responsiva-largura-fluida
      - name: Apply the responsive table implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = '<div className="app-container">'
          new = '<div className={`app-container ${isDemandWorkspace ? \'app-container--workspace\' : \'\'}`.trim()}>'
          if text.count(old) != 1:
              raise SystemExit('Expected a single app-container root')
          app.write_text(text.replace(old, new, 1))

          main = Path('src/main.tsx')
          text = main.read_text()
          old = "import './error-boundary.css';\n"
          new = "import './error-boundary.css';\nimport './demandas-table-responsive.css';\n"
          if text.count(old) != 1:
              raise SystemExit('Expected error-boundary import anchor')
          main.write_text(text.replace(old, new, 1))

          table = Path('src/components/DemandasTable.tsx')
          text = table.read_text()
          replacements = [
              ("import React, { useEffect, useMemo, useState } from 'react';", "import React, { useEffect, useMemo, useRef, useState } from 'react';"),
              ("  const [deleteTarget, setDeleteTarget] = useState<Demanda | null>(null);\n  const columnHelper", "  const [deleteTarget, setDeleteTarget] = useState<Demanda | null>(null);\n  const topScrollbarRef = useRef<HTMLDivElement>(null);\n  const tableScrollRef = useRef<HTMLDivElement>(null);\n  const columnHelper"),
              ("      size: 220,", "      size: 190,"),
              ("      size: 300,", "      size: 250,"),
              ("      size: 230,", "      size: 195,"),
              ("      size: 100,", "      size: 96,"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence: {old!r}; found {text.count(old)}')
              text = text.replace(old, new, 1)
          if text.count('      size: 130,') != 3:
              raise SystemExit('Expected three 130px columns')
          text = text.replace('      size: 130,', '      size: 115,')

          anchor = "  const total = table.getRowCount();\n"
          insertion = """  const tableWidth = table.getTotalSize();
  const synchronizeHorizontalScroll = (
    source: HTMLDivElement,
    target: HTMLDivElement | null,
  ) => {
    if (target && target.scrollLeft !== source.scrollLeft) {
      target.scrollLeft = source.scrollLeft;
    }
  };

  const total = table.getRowCount();
"""
          if text.count(anchor) != 1:
              raise SystemExit('Expected total row anchor')
          text = text.replace(anchor, insertion, 1)

          old = """        <div className=\"table-responsive\" role=\"region\" aria-label={searchResultMode === 'approximate' ? 'Tabela de resultados próximos' : 'Tabela de demandas'} tabIndex={0}>
          <table className=\"demandas-table\">
"""
          new = """        <div
          ref={topScrollbarRef}
          className=\"table-scrollbar-top\"
          role=\"region\"
          aria-label=\"Rolagem horizontal da tabela\"
          aria-hidden=\"false\"
          tabIndex={0}
          onScroll={(event) => synchronizeHorizontalScroll(event.currentTarget, tableScrollRef.current)}
        >
          <div className=\"table-scrollbar-spacer\" style={{ width: tableWidth }} />
        </div>
        <div
          ref={tableScrollRef}
          className=\"table-responsive\"
          role=\"region\"
          aria-label={searchResultMode === 'approximate' ? 'Tabela de resultados próximos' : 'Tabela de demandas'}
          tabIndex={0}
          onScroll={(event) => synchronizeHorizontalScroll(event.currentTarget, topScrollbarRef.current)}
        >
          <table className=\"demandas-table\" style={{ minWidth: tableWidth }}>
"""
          if text.count(old) != 1:
              raise SystemExit('Expected responsive table wrapper anchor')
          text = text.replace(old, new, 1)

          old = """                    <th key={header.id} style={{ width: header.getSize(), textAlign: leftAlignedColumns.includes(header.column.id) ? 'left' : 'center' }}>
"""
          new = """                    <th
                      key={header.id}
                      className={`column-${header.column.id}`}
                      style={{ width: header.getSize(), textAlign: leftAlignedColumns.includes(header.column.id) ? 'left' : 'center' }}
                    >
"""
          if text.count(old) != 1:
              raise SystemExit('Expected table header cell anchor')
          text = text.replace(old, new, 1)

          old = """                    <td key={cell.id} className={['assunto', 'proximaAcaoEm'].includes(cell.column.id) ? 'text-start-cell' : ''} style={{ textAlign: leftAlignedColumns.includes(cell.column.id) ? 'left' : 'center' }}>
"""
          new = """                    <td
                      key={cell.id}
                      className={[
                        ['assunto', 'proximaAcaoEm'].includes(cell.column.id) ? 'text-start-cell' : '',
                        `column-${cell.column.id}`,
                      ].filter(Boolean).join(' ')}
                      style={{ textAlign: leftAlignedColumns.includes(cell.column.id) ? 'left' : 'center' }}
                    >
"""
          if text.count(old) != 1:
              raise SystemExit('Expected table body cell anchor')
          text = text.replace(old, new, 1)
          table.write_text(text)

          Path('src/demandas-table-responsive.css').write_text("""/* Carteira de demandas: usa o espaço real da tela e preserva acesso às ações. */
.app-container--workspace {
  max-width: 1760px;
  padding-inline: clamp(16px, 2vw, 32px);
}

.table-scrollbar-top {
  display: none;
  width: 100%;
  height: 16px;
  overflow-x: auto;
  overflow-y: hidden;
  margin-bottom: 4px;
  overscroll-behavior-inline: contain;
  scrollbar-gutter: stable;
}

.table-scrollbar-spacer {
  height: 1px;
}

@media (min-width: 769px) {
  .app-container--workspace .demandas-table {
    width: 100%;
    table-layout: fixed;
  }

  .app-container--workspace .demandas-table th,
  .app-container--workspace .demandas-table td {
    box-sizing: border-box;
    padding-inline: 10px;
  }

  .app-container--workspace .demandas-table .column-actions {
    position: sticky;
    right: 0;
    z-index: 2;
    padding-inline: 6px;
    background: #ffffff;
    box-shadow: -10px 0 14px -14px rgba(11, 29, 52, 0.75);
  }

  .app-container--workspace .demandas-table thead .column-actions {
    z-index: 4;
    background: #e5e8ed;
  }

  .app-container--workspace .demandas-table tbody tr:hover .column-actions {
    background: #f8fafc;
  }

  .app-container--workspace .demandas-table .column-status .badge {
    max-width: 100%;
    white-space: normal;
    line-height: 1.2;
    text-align: center;
  }
}

@media (min-width: 769px) and (max-width: 1279px) {
  .table-scrollbar-top {
    display: block;
  }
}

@media (min-width: 769px) and (max-width: 1400px) {
  .app-container--workspace {
    max-width: none;
    padding-inline: 16px;
  }
}

@media (max-width: 768px) {
  .app-container--workspace {
    max-width: 100%;
  }
}
""")
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/components/DemandasTable.tsx src/demandas-table-responsive.css
          git commit -m "fix: make demand table use responsive workspace width"
          git push
