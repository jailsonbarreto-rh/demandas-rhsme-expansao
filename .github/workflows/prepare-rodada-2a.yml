name: Prepare Round 2A

on:
  push:
    branches:
      - chore/rodada-2a-node24-fonte-unica

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/rodada-2a-node24-fonte-unica
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Use package.json as the Node version source
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in (
              '.github/workflows/dependency-health.yml',
              '.github/workflows/supabase-local-migrations.yml',
          ):
              path = Path(filename)
              text = path.read_text()
              old = '          node-version: 24\n          cache: npm'
              new = '          node-version-file: package.json\n          cache: npm'
              if old not in text:
                  raise SystemExit(f'Expected Node configuration not found in {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit prepared change
        run: |
          rm .github/workflows/prepare-rodada-2a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dependency-health.yml .github/workflows/supabase-local-migrations.yml .github/workflows/prepare-rodada-2a.yml
          git commit -m "ci: use package.json as Node version source"
          git push

# retrigger preparation
