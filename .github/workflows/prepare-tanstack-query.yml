name: Prepare TanStack Query dependency

on:
  push:
    branches:
      - feat/rodada-3-tanstack-query

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rodada-3-tanstack-query
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install fixed TanStack Query version
        run: |
          npm pkg set 'dependencies.@tanstack/react-query=5.101.4'
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Commit dependency and lockfile
        run: |
          rm .github/workflows/prepare-tanstack-query.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-tanstack-query.yml
          git commit -m "chore: add TanStack Query 5.101.4"
          git push
