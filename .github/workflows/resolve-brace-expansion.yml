name: Resolve brace-expansion compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'chore/remove-brace-expansion-patch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-brace-expansion-patch
          fetch-depth: 0

      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:chore/remove-brace-expansion-patch

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Prepare standardized patch configuration
        run: node scripts/prepare-brace-expansion-adapter.mjs

      - name: Generate lockfile and unpatched clean tree
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Generate versioned patches
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/create-brace-expansion-patches.mjs
            npx patch-package minimatch
            npx patch-package readdir-glob/minimatch
            echo '--- patches gerados ---'
            find patches -maxdepth 1 -type f -print -exec sed -n '1,80p' {} \;
            test -f patches/minimatch+3.1.5.patch
            test "$(find patches -maxdepth 1 -type f -name '*.patch' | wc -l)" -eq 2
            find patches -maxdepth 1 -type f -name '*minimatch+5.1.9.patch' | grep -q .
          } 2>&1 | tee brace-expansion-patch-generation-report.txt

      - name: Upload patch generation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brace-expansion-patch-generation-report
          path: brace-expansion-patch-generation-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prove clean npm ci applies both patches
        shell: bash
        run: |
          set -o pipefail
          rm -rf node_modules
          npm ci 2>&1 | tee brace-expansion-install-report.txt

      - name: Upload installation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brace-expansion-install-report
          path: brace-expansion-install-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Record diagnosis and effective tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/maintenance
          {
            echo '# Resolução da compatibilidade de brace-expansion — 28 de julho de 2026'
            echo
            echo '## Diagnóstico confirmado'
            echo
            echo 'O override seguro para `brace-expansion` 5.0.8 altera a forma de exportação esperada por duas versões transitivas de `minimatch` presentes na árvore.'
            echo
            echo '- o `minimatch` raiz 3.1.5 usa `var expand = require("brace-expansion")`;'
            echo '- o `minimatch` 5.1.9 aninhado em `readdir-glob` usa `const expand = require("brace-expansion")`.'
            echo
            echo 'A versão corrigida `brace-expansion` 5.0.8 expõe a função pela propriedade `expand`. Os dois consumidores precisam referenciar essa propriedade, mas seus arquivos não possuem o mesmo padrão textual. O script anterior tratava ambos como se fossem idênticos e já era incompatível com a segunda cópia.'
            echo
            echo 'A remoção integral do override e do patch foi testada. A instalação, o `minimatch` e o ExcelJS funcionaram, porém a árvore restaurou 13 vulnerabilidades de severidade alta. Portanto, a correção continua necessária enquanto essas dependências transitivas permanecerem.'
            echo
            echo '## Solução adotada'
            echo
            echo 'O script próprio que modificava diretamente caminhos internos de `node_modules` foi removido. As duas alterações mínimas passaram a ser mantidas em patches unificados, versionados e aplicados por `patch-package` 8.0.1 durante o `postinstall`.'
            echo
            echo 'O override de `brace-expansion` 5.0.8 foi preservado para impedir a regressão das vulnerabilidades. O CI exige a aplicação bem-sucedida de ambos os patches em uma instalação limpa e executa testes específicos sobre expansão de chaves nas duas versões de `minimatch` e geração de Excel.'
            echo
            echo '## Árvore efetiva'
            echo
            echo '```text'
            npm ls brace-expansion minimatch readdir-glob exceljs patch-package --all
            echo '```'
            echo
            echo '## Controles permanentes'
            echo
            echo '- `npm ci` em árvore removida previamente;'
            echo '- `patch-package --error-on-fail`;'
            echo '- auditoria de vulnerabilidades, assinaturas e proveniência;'
            echo '- teste dos dois arquivos efetivamente corrigidos;'
            echo '- teste de expansão de chaves nas duas instâncias;'
            echo '- criação e serialização real de workbook pelo ExcelJS;'
            echo '- lint tipado, cobertura, build, orçamento de bundle e Playwright.'
          } > docs/maintenance/BRACE_EXPANSION_RESOLUTION_2026-07-28.md

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run check:full 2>&1 | tee brace-expansion-gate-report.txt

      - name: Upload full gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brace-expansion-gate-report
          path: brace-expansion-gate-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated resolution
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resolve-brace-expansion.yml
          rm scripts/prepare-brace-expansion-adapter.mjs scripts/create-brace-expansion-patches.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json patches scripts/patch-brace-expansion-compat.mjs scripts/brace-expansion-compat.test.mjs scripts/prepare-brace-expansion-adapter.mjs scripts/create-brace-expansion-patches.mjs docs/maintenance/BRACE_EXPANSION_RESOLUTION_2026-07-28.md .github/workflows/resolve-brace-expansion.yml
          git commit -m 'chore(deps): padronizar correção de brace-expansion'
          git push origin HEAD:chore/remove-brace-expansion-patch
