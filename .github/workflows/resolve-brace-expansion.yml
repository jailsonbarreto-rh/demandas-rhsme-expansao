name: Resolve brace-expansion compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'chore/remove-brace-expansion-patch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-brace-expansion-patch

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Prepare versioned compatibility adapter
        run: node scripts/prepare-brace-expansion-adapter.mjs

      - name: Regenerate lockfile and install clean tree
        shell: bash
        run: |
          set -o pipefail
          {
            npm install --package-lock-only --ignore-scripts
            rm -rf node_modules
            npm ci
          } 2>&1 | tee brace-expansion-install-report.txt

      - name: Upload installation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brace-expansion-install-report
          path: brace-expansion-install-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Record resolved dependency tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/maintenance
          {
            echo '# Resolução da compatibilidade de brace-expansion — 28 de julho de 2026'
            echo
            echo '## Diagnóstico'
            echo
            echo 'O override direto para `brace-expansion` 5.0.8 eliminava a vulnerabilidade, mas alterava a API CommonJS esperada pelo `minimatch` 3. O `postinstall` compensava essa diferença modificando arquivos instalados em `node_modules`.'
            echo
            echo 'A tentativa de remover simultaneamente o override e o script restaurou a árvore sem incompatibilidade, porém reintroduziu 13 vulnerabilidades de severidade alta nas versões antigas de `brace-expansion` exigidas por `minimatch` e `readdir-glob`.'
            echo
            echo '## Solução adotada'
            echo
            echo 'Foi criado um adaptador local mínimo e versionado que preserva a API callable esperada pelos consumidores antigos e delega a expansão à versão corrigida `brace-expansion` 5.0.8, instalada sob o alias `brace-expansion-modern`.'
            echo
            echo 'O adaptador é aplicado pelo mecanismo nativo `overrides` do npm. Não há alteração posterior em `node_modules`, substituição textual, `postinstall` ou `patch-package`.'
            echo
            echo '## Árvore efetiva'
            echo
            echo '```text'
            npm ls brace-expansion brace-expansion-modern minimatch readdir-glob exceljs --all
            echo '```'
            echo
            echo '## Explicação do npm'
            echo
            echo '```text'
            npm explain brace-expansion
            echo '```'
            echo
            echo '## Controles permanentes'
            echo
            echo '- instalação limpa por `npm ci`;'
            echo '- auditoria de vulnerabilidades e assinaturas;'
            echo '- teste automatizado da API CommonJS;'
            echo '- teste das duas instâncias de `minimatch` utilizadas;'
            echo '- criação e serialização real de workbook pelo ExcelJS;'
            echo '- lint, cobertura, build, orçamento de bundle e Playwright.'
          } > docs/maintenance/BRACE_EXPANSION_RESOLUTION_2026-07-28.md

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run check:full 2>&1 | tee brace-expansion-gate-report.txt

      - name: Upload full gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brace-expansion-gate-report
          path: brace-expansion-gate-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated resolution
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resolve-brace-expansion.yml scripts/prepare-brace-expansion-adapter.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json scripts/patch-brace-expansion-compat.mjs scripts/brace-expansion-compat.test.mjs scripts/prepare-brace-expansion-adapter.mjs vendor/brace-expansion-compat docs/maintenance/BRACE_EXPANSION_RESOLUTION_2026-07-28.md .github/workflows/resolve-brace-expansion.yml
          git commit -m 'chore(deps): substituir patch manual por adaptador auditável'
          git push origin HEAD:chore/remove-brace-expansion-patch
