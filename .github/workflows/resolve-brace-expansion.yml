name: Resolve brace-expansion compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'chore/remove-brace-expansion-patch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-brace-expansion-patch

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Replace node_modules patch with versioned compatibility adapter
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete packageJson.scripts.postinstall;
          packageJson.scripts['test:dependency-compat'] = 'node --test scripts/brace-expansion-compat.test.mjs';
          packageJson.scripts.check = packageJson.scripts.check.replace(
            'npm audit signatures &&',
            'npm audit signatures && npm run test:dependency-compat &&',
          );
          packageJson.dependencies['brace-expansion-modern'] = 'npm:brace-expansion@5.0.8';
          packageJson.overrides ??= {};
          packageJson.overrides['brace-expansion'] = 'file:vendor/brace-expansion-compat';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          rm scripts/patch-brace-expansion-compat.mjs
          mkdir -p vendor/brace-expansion-compat
          cat > vendor/brace-expansion-compat/package.json <<'JSON'
          {
            "name": "brace-expansion",
            "version": "5.0.8",
            "private": true,
            "main": "index.cjs",
            "license": "UNLICENSED"
          }
          JSON
          cat > vendor/brace-expansion-compat/index.cjs <<'JS'
          'use strict';

          const modernModule = require('brace-expansion-modern');
          const expand = modernModule.expand || modernModule;

          if (typeof expand !== 'function') {
            throw new TypeError('brace-expansion-modern não expôs uma função compatível.');
          }

          module.exports = expand;
          module.exports.expand = expand;
          JS

          cat > scripts/brace-expansion-compat.test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import test from 'node:test';
          import ExcelJS from 'exceljs';

          const require = createRequire(import.meta.url);

          test('adaptador mantém a API CommonJS esperada pelo minimatch 3', () => {
            const expand = require('brace-expansion');
            assert.equal(typeof expand, 'function');
            assert.deepEqual(expand('relatorio-{2025,2026}.xlsx'), [
              'relatorio-2025.xlsx',
              'relatorio-2026.xlsx',
            ]);
          });

          test('minimatch direto e o minimatch do readdir-glob permanecem funcionais', () => {
            const rootMinimatch = require('minimatch');
            const nestedMinimatch = require('readdir-glob/node_modules/minimatch');
            assert.equal(rootMinimatch('relatorio.xlsx', '*.xlsx'), true);
            assert.equal(nestedMinimatch('relatorio.xlsx', '*.xlsx'), true);
          });

          test('ExcelJS continua criando e serializando arquivos', async () => {
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Validação');
            worksheet.addRow(['CTRH', 'ok']);
            const buffer = await workbook.xlsx.writeBuffer();
            assert.ok(buffer.byteLength > 0);
          });
          JS

          npm install --package-lock-only --ignore-scripts
          rm -rf node_modules
          npm ci

      - name: Record resolved dependency tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/maintenance
          {
            echo '# Resolução da compatibilidade de brace-expansion — 28 de julho de 2026'
            echo
            echo '## Diagnóstico'
            echo
            echo 'O override direto para `brace-expansion` 5.0.8 eliminava a vulnerabilidade, mas alterava a API CommonJS esperada pelo `minimatch` 3. O `postinstall` compensava essa diferença modificando arquivos instalados em `node_modules`.'
            echo
            echo 'A tentativa de remover simultaneamente o override e o script restaurou a árvore sem incompatibilidade, porém reintroduziu 13 vulnerabilidades de severidade alta nas versões antigas de `brace-expansion` exigidas por `minimatch` e `readdir-glob`.'
            echo
            echo '## Solução adotada'
            echo
            echo 'Foi criado um adaptador local mínimo e versionado que preserva a API callable esperada pelos consumidores antigos e delega a expansão à versão corrigida `brace-expansion` 5.0.8, instalada sob o alias `brace-expansion-modern`.'
            echo
            echo 'O adaptador é aplicado pelo mecanismo nativo `overrides` do npm. Não há alteração posterior em `node_modules`, substituição textual, `postinstall` ou `patch-package`.'
            echo
            echo '## Árvore efetiva'
            echo
            echo '```text'
            npm ls brace-expansion brace-expansion-modern minimatch readdir-glob exceljs --all
            echo '```'
            echo
            echo '## Explicação do npm'
            echo
            echo '```text'
            npm explain brace-expansion
            echo '```'
            echo
            echo '## Controles permanentes'
            echo
            echo '- instalação limpa por `npm ci`;'
            echo '- auditoria de vulnerabilidades e assinaturas;'
            echo '- teste automatizado da API CommonJS;'
            echo '- teste das duas instâncias de `minimatch` utilizadas;'
            echo '- criação e serialização real de workbook pelo ExcelJS;'
            echo '- lint, cobertura, build, orçamento de bundle e Playwright.'
          } > docs/maintenance/BRACE_EXPANSION_RESOLUTION_2026-07-28.md

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run check:full 2>&1 | tee brace-expansion-gate-report.txt

      - name: Upload full gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brace-expansion-gate-report
          path: brace-expansion-gate-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated resolution
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resolve-brace-expansion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json scripts/patch-brace-expansion-compat.mjs scripts/brace-expansion-compat.test.mjs vendor/brace-expansion-compat docs/maintenance/BRACE_EXPANSION_RESOLUTION_2026-07-28.md .github/workflows/resolve-brace-expansion.yml
          git commit -m 'chore(deps): substituir patch manual por adaptador auditável'
          git push origin HEAD:chore/remove-brace-expansion-patch
