name: Rodada 3.2 diagnostic

on:
  push:
    branches:
      - chore/rodada-3-2-preparacao-typescript
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  dependency-and-tsconfig-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Set up Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Regenerate lockfile for selected updates
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile on branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerar lockfile da Rodada 3.2"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install regenerated dependency tree
        run: npm ci

      - name: Report remaining updates
        shell: bash
        run: |
          set +e
          npm outdated --json > npm-outdated.json
          status=$?
          cat npm-outdated.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Show effective TypeScript configuration
        run: npx tsc --showConfig > tsconfig-effective.json

      - name: Run current compiler gate
        run: npx tsc --noEmit

      - name: Run Knip diagnostic
        run: npm run analyze:unused

      - name: Upload diagnostics and regenerated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: rodada-3-2-diagnosticos
          path: |
            package-lock.json
            npm-outdated.json
            tsconfig-effective.json
          retention-days: 14
