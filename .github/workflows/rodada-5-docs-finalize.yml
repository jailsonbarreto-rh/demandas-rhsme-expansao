name: Rodada 5 docs finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.event.pull_request.head.ref == 'chore/rodada-5-atualizacoes-pacotes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize current documentation
        run: |
          python3 <<'PY'
          from pathlib import Path

          handoff = Path('docs/HANDOFF.md')
          text = handoff.read_text()
          text = text.replace(
              'Atualizado em: **3 de agosto de 2026 — Rodada 4 concluída; TypeScript 6.0.3 integrado à base técnica**',
              'Atualizado em: **3 de agosto de 2026 — Rodada 5 concluída; pacotes compatíveis atualizados e ESLint 10 adiado por incompatibilidade oficial**'
          )
          text = text.replace(
              '| Atividade técnica atual | Rodada 4 encerrada; nenhuma atualização estrutural seguinte autorizada automaticamente |',
              '| Atividade técnica atual | Rodada 5 encerrada; seis atualizações compatíveis integradas e validadas |'
          )
          text = text.replace(
              '| Próxima atualização candidata | estudo de observabilidade de erros; TypeScript 7 permanece adiado para experiência própria |',
              '| Próxima atualização candidata | estudo de observabilidade de erros; ESLint 10 aguarda suporte estável do JSX A11y; TypeScript 7 permanece adiado |'
          )
          marker = '## Regra permanente de modernização proativa'
          section = '''## Rodada 5 — Atualizações compatíveis de pacotes\n\nA Rodada 5 foi executada pelo PR #143.\n\n### Atualizações integradas\n\n- `@supabase/supabase-js` 2.112.0;\n- `react-hook-form` 7.84.0;\n- `@hookform/resolvers` 5.7.1;\n- `motion` 12.43.0;\n- Vite 8.2.0;\n- `@testing-library/jest-dom` 7.0.0.\n\nO lockfile foi regenerado pelo npm em Node 24. Node `24.x`, `@types/node` 24.13.3 e TypeScript 6.0.3 foram preservados. Nenhum código-fonte, `tsconfig`, banco, migration, RLS, dado, regra de negócio, Supabase remoto ou Production foi alterado.\n\n### ESLint 10\n\nA instalação limpa do ESLint 10 foi bloqueada pelo peer dependency oficial de `eslint-plugin-jsx-a11y` 6.10.2, que admite somente ESLint até a linha 9. Não foram usados `--force`, `--legacy-peer-deps`, código não publicado nem retirada da fiscalização de acessibilidade. ESLint e `@eslint/js` permanecem em 9.39.5 até uma versão estável compatível do plugin.\n\n### Validação\n\n- zero vulnerabilidades;\n- 576 assinaturas e 159 attestations verificadas;\n- documentação 9/9;\n- lint aprovado;\n- 80 arquivos e 365 testes aprovados;\n- cobertura global de linhas de 82,54%;\n- TypeScript 6.0.3 e Vite 8.2.0 aprovados;\n- bundle inicial de 220.300 bytes, 54,79% abaixo da linha de base;\n- inspeção pública aprovada;\n- Knip sem novos achados;\n- 42 cenários Playwright aprovados em desktop e mobile.\n\nA evidência completa está em `docs/execution/RODADA_5_ATUALIZACOES_PACOTES_RELATORIO_FINAL_2026-08-03.md`.\n\n'''
          if '## Rodada 5 — Atualizações compatíveis de pacotes' not in text:
              text = text.replace(marker, section + marker)
          handoff.write_text(text)

          consolidated = Path('docs/execution/PLANO_CONSOLIDADO_MANUTENCAO_MODERNIZACAO_CTRH_v1.1.md')
          text = consolidated.read_text()
          marker = '## 7. Oportunidades funcionais condicionadas'
          section = '''## 7. Rodada 5 — Atualizações compatíveis de pacotes — CONCLUÍDA\n\nO PR #143 integrou Supabase JavaScript 2.112.0, React Hook Form 7.84.0, resolvers 5.7.1, Motion 12.43.0, Vite 8.2.0 e jest-dom 7.0.0. O lockfile foi regenerado pelo npm em Node 24 e o gate integral aprovou segurança, lint, 365 testes, cobertura, build, bundle, inspeção pública, Knip e 42 cenários Playwright.\n\nA atualização do ESLint 10 foi tentada e interrompida corretamente porque `eslint-plugin-jsx-a11y` 6.10.2 ainda declara suporte somente até ESLint 9. A manutenção preservou ESLint 9.39.5, todas as regras de acessibilidade e uma árvore reproduzível, sem flags de contorno. O ESLint 10 será retomado após suporte oficial estável do plugin.\n\nNode 24, `@types/node` 24.13.3 e TypeScript 6.0.3 permaneceram inalterados. Não houve mudança de código, banco, migrations, RLS, dados, regras de negócio ou Production.\n\n'''
          if '## 7. Rodada 5 — Atualizações compatíveis de pacotes — CONCLUÍDA' not in text:
              text = text.replace(marker, section + marker)
              text = text.replace('## 7. Oportunidades funcionais condicionadas', '## 8. Oportunidades funcionais condicionadas')
              text = text.replace('## 8. Validação por PR', '## 9. Validação por PR')
              text = text.replace('## 9. Rollback', '## 10. Rollback')
              text = text.replace('## 10. Autoridade', '## 11. Autoridade')
          consolidated.write_text(text)

          opportunities = Path('docs/product/REGISTRO_OPORTUNIDADES_TECNICAS_MODERNIZACAO_CTRH_v1.1.md')
          text = opportunities.read_text()
          anchor = '| TypeScript 6.0.3 | atualização concluída, compatível e sem ajuste de código ou `tsconfig` | PR #138 |'
          additions = anchor + '''\n| Supabase JavaScript 2.112.0 | atualização compatível concluída | PR #143 |\n| React Hook Form 7.84.0 e resolvers 5.7.1 | atualização conjunta concluída | PR #143 |\n| Motion 12.43.0 | atualização compatível concluída | PR #143 |\n| Vite 8.2.0 | atualização de build concluída | PR #143 |\n| jest-dom 7.0.0 | atualização de testes concluída | PR #143 |'''
          if '| Supabase JavaScript 2.112.0 | atualização compatível concluída | PR #143 |' not in text:
              text = text.replace(anchor, additions)
          old_rows = [
              '| `@supabase/supabase-js` | 2.111.0 | SDK de produção; exige PR isolado e benefício aplicável |\n',
              '| `react-hook-form` | 7.84.0 | fluxo de formulários; exige PR isolado |\n',
              '| `@hookform/resolvers` | 5.7.1 | deve ser analisado junto do React Hook Form |\n',
              '| `motion` | 12.43.0 | executa na interface; exige avaliação visual e PR próprio |\n',
              '| `vite` | 8.2.0 | ferramenta estrutural de build; deve ser avaliada separadamente |\n',
              '| `@testing-library/jest-dom` 7 | linha major | fora do escopo da preparação atual |\n',
          ]
          for row in old_rows:
              text = text.replace(row, '')
          text = text.replace(
              '| ESLint 10 | linha major | fora do escopo da preparação atual |',
              '| ESLint 10 | linha major | bloqueado até `eslint-plugin-jsx-a11y` publicar suporte oficial estável; ESLint 9.39.5 preservado |'
          )
          opportunities.write_text(text)
          PY

      - name: Validate docs
        run: |
          npm ci
          npm run check:docs

      - name: Commit synchronized docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF.md docs/execution/PLANO_CONSOLIDADO_MANUTENCAO_MODERNIZACAO_CTRH_v1.1.md docs/product/REGISTRO_OPORTUNIDADES_TECNICAS_MODERNIZACAO_CTRH_v1.1.md
          git commit -m "docs: consolidar rodada 5 de dependências"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
