name: Rodada 5 full gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rodada-5-full-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-gate:
    if: github.event.pull_request.head.ref == 'chore/rodada-5-atualizacoes-pacotes'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Verify preserved platform
        run: |
          node --version
          npx tsc --version
          node <<'NODE'
          const p = require('./package.json')
          if (p.engines.node !== '24.x') throw new Error('Node engine changed')
          if (p.devDependencies['@types/node'] !== '24.13.3') throw new Error('@types/node changed')
          if (p.devDependencies.typescript !== '6.0.3') throw new Error('TypeScript changed')
          NODE

      - name: Verify dependency tree
        run: |
          npm ls \
            @supabase/supabase-js \
            react-hook-form \
            @hookform/resolvers \
            motion \
            vite \
            eslint \
            @eslint/js \
            @testing-library/jest-dom \
            typescript \
            typescript-eslint \
            eslint-plugin-jsx-a11y \
            @types/node --depth=1

      - name: Run documentation and security gates
        run: |
          npm run check:docs
          npm audit --audit-level=high
          npm audit signatures
          npm run test:dependency-compat

      - name: Run lint, coverage, build and bundle gates
        run: |
          npm run lint
          npm run test:coverage
          npm run build
          npm run check:bundle
          npm run check:public-bundle
          npm run analyze:unused

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright desktop and mobile
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rodada-5-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
