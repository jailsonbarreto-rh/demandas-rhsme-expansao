name: Rodada 5 package update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: rodada-5-package-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-and-verify:
    if: github.event.pull_request.head.ref == 'chore/rodada-5-atualizacoes-pacotes'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Confirm preserved runtime and compiler
        run: |
          node --version
          node -e "const p=require('./package.json'); if(p.engines.node !== '24.x') throw new Error('Node engine changed'); if(p.devDependencies.typescript !== '6.0.3') throw new Error('TypeScript changed'); if(!p.devDependencies['@types/node'].startsWith('24.')) throw new Error('@types/node left Node 24 line')"

      - name: Install exact compatible versions
        run: |
          npm install --save-exact \
            @supabase/supabase-js@2.112.0 \
            react-hook-form@7.84.0 \
            @hookform/resolvers@5.7.1 \
            motion@12.43.0
          npm install --save-dev --save-exact \
            vite@8.2.0 \
            @testing-library/jest-dom@7.0.0 \
            eslint@9.39.5 \
            @eslint/js@9.39.5

      - name: Verify exact manifest versions
        run: |
          node <<'NODE'
          const p = require('./package.json')
          const expected = {
            dependencies: {
              '@supabase/supabase-js': '2.112.0',
              'react-hook-form': '7.84.0',
              '@hookform/resolvers': '5.7.1',
              motion: '12.43.0',
            },
            devDependencies: {
              vite: '8.2.0',
              eslint: '9.39.5',
              '@eslint/js': '9.39.5',
              '@testing-library/jest-dom': '7.0.0',
            },
          }
          for (const [section, entries] of Object.entries(expected)) {
            for (const [name, version] of Object.entries(entries)) {
              if (p[section]?.[name] !== version) {
                throw new Error(`${name}: expected ${version}, found ${p[section]?.[name]}`)
              }
            }
          }
          if (p.engines.node !== '24.x') throw new Error('Node engine changed')
          if (p.devDependencies.typescript !== '6.0.3') throw new Error('TypeScript changed')
          if (!p.devDependencies['@types/node'].startsWith('24.')) throw new Error('@types/node changed line')
          NODE

      - name: Commit npm-generated manifest and lockfile
        id: commit
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: atualizar pacotes compatíveis da rodada 5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install from committed lockfile
        if: steps.commit.outputs.changed == 'false'
        run: npm ci

      - name: Verify dependency tree
        if: steps.commit.outputs.changed == 'false'
        run: |
          npm ls \
            @supabase/supabase-js \
            react-hook-form \
            @hookform/resolvers \
            motion \
            vite \
            eslint \
            @eslint/js \
            @testing-library/jest-dom \
            typescript \
            typescript-eslint \
            eslint-plugin-jsx-a11y \
            @types/node --depth=1

      - name: Run compatibility diagnostics
        if: steps.commit.outputs.changed == 'false'
        run: |
          npm run test:dependency-compat
          npm run lint
          npm run build
          npm run check:bundle
          npm run check:public-bundle
          npm run analyze:unused
