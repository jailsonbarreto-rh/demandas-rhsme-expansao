name: Security brace lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/brace-expansion-compat.node.mjs'
      - 'scripts/ci/sync-brace-security-docs.mjs'
      - 'docs/**'
      - '.github/workflows/security-brace-lockfile.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-and-validate:
    if: github.event.pull_request.head.ref == 'security/brace-expansion-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency resolution diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git diff --check

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: sincronizar lockfile da correção de segurança'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Synchronize current maintenance documentation
        run: node scripts/ci/sync-brace-security-docs.mjs

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- docs/HANDOFF.md docs/execution/PLANO_CONSOLIDADO_MANUTENCAO_MODERNIZACAO_CTRH_v1.1.md; then
            echo 'Current documentation already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/HANDOFF.md docs/execution/PLANO_CONSOLIDADO_MANUTENCAO_MODERNIZACAO_CTRH_v1.1.md
            git commit -m 'docs: sincronizar correção transitiva de segurança'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install exact dependency tree
        run: npm ci

      - name: Validate documentation consistency
        run: npm run check:docs

      - name: Reject high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Validate brace-expansion compatibility
        run: npm run test:dependency-compat

      - name: Validate lint
        run: npm run lint

      - name: Validate unit, integration and coverage tests
        run: npm run test:coverage

      - name: Validate production build
        run: npm run build

      - name: Validate bundle budgets
        run: npm run check:bundle

      - name: Validate public bundle
        run: npm run check:public-bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate browser regression suite
        run: npm run test:e2e
