name: Supabase local migration gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/seed.sql'
      - '.github/workflows/supabase-local-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-migrations:
    name: Replay and validate migrations in ephemeral Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CYCLE3_MIGRATION: supabase/migrations/20260722101325_20260722090000_central_trabalho_expand.sql
      CYCLE4_CREATE: supabase/migrations/20260722123530_cycle4_helpers_and_create_v2.sql
      CYCLE4_EDIT: supabase/migrations/20260722123627_cycle4_edit_demand.sql
      CYCLE4_PROGRESS: supabase/migrations/20260722123713_cycle4_progress_and_status.sql
      CYCLE4_ADMIN: supabase/migrations/20260722123920_cycle4_admin_restore_and_grants.sql
      CYCLE4_HARDENING: supabase/migrations/20260722123935_cycle4_block_direct_writes.sql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Start pre-Cycle-3 baseline database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle3-migration /tmp/cycle4-migrations
          mv "$CYCLE3_MIGRATION" /tmp/cycle3-migration/
          mv "$CYCLE4_CREATE" /tmp/cycle4-migrations/
          mv "$CYCLE4_EDIT" /tmp/cycle4-migrations/
          mv "$CYCLE4_PROGRESS" /tmp/cycle4-migrations/
          mv "$CYCLE4_ADMIN" /tmp/cycle4-migrations/
          mv "$CYCLE4_HARDENING" /tmp/cycle4-migrations/
          supabase db start

      - name: Insert synthetic Cycle 3 legacy fixture
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle3_legacy_fixture.sql

      - name: Apply and validate Cycle 3
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/cycle3-migration/20260722101325_20260722090000_central_trabalho_expand.sql "$CYCLE3_MIGRATION"
          supabase migration up --local
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle3_invariants.sql

      - name: Insert synthetic Cycle 4 users
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle4_mutations_fixture.sql

      - name: Apply Cycle 4 migrations
        shell: bash
        run: |
          set -o pipefail
          mv /tmp/cycle4-migrations/20260722123530_cycle4_helpers_and_create_v2.sql "$CYCLE4_CREATE"
          mv /tmp/cycle4-migrations/20260722123627_cycle4_edit_demand.sql "$CYCLE4_EDIT"
          mv /tmp/cycle4-migrations/20260722123713_cycle4_progress_and_status.sql "$CYCLE4_PROGRESS"
          mv /tmp/cycle4-migrations/20260722123920_cycle4_admin_restore_and_grants.sql "$CYCLE4_ADMIN"
          mv /tmp/cycle4-migrations/20260722123935_cycle4_block_direct_writes.sql "$CYCLE4_HARDENING"
          supabase migration up --local 2>&1 | tee cycle4-migration-report.txt

      - name: Validate Cycle 4 roles, transactions and logical deletion
        shell: bash
        run: |
          set -o pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle4_mutations_invariants.sql 2>&1 | tee cycle4-invariants-report.txt
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle4_physical_delete_invariants.sql 2>&1 | tee cycle4-physical-delete-report.txt

      - name: Upload Cycle 4 database reports and validated migrations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycle4-database-reports
          path: |
            cycle4-migration-report.txt
            cycle4-invariants-report.txt
            cycle4-physical-delete-report.txt
            supabase/migrations/20260722123530_cycle4_helpers_and_create_v2.sql
            supabase/migrations/20260722123627_cycle4_edit_demand.sql
            supabase/migrations/20260722123713_cycle4_progress_and_status.sql
            supabase/migrations/20260722123920_cycle4_admin_restore_and_grants.sql
            supabase/migrations/20260722123935_cycle4_block_direct_writes.sql
          if-no-files-found: warn
          retention-days: 14

      - name: Replay the complete migration chain from scratch
        run: supabase db reset --local --no-seed

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup || true
