name: Regenerate lock after Table v9 rollback

on:
  push:
    branches:
      - experiment/latest-except-toolchain-majors-20260903

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/latest-except-toolchain-majors-20260903
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Regenerate coherent lockfile
        run: npm install
      - name: Keep audit clean
        run: npm audit fix && npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerar lockfile sem TanStack Table 9"
          git push origin HEAD:experiment/latest-except-toolchain-majors-20260903