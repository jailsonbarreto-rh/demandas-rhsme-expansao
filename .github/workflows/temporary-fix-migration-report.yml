name: Temporary fix migration report

on:
  push:
    branches:
      - feat/governanca-migracao-20260720
    paths:
      - .github/workflows/temporary-fix-migration-report.yml

permissions:
  contents: write

jobs:
  patch-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/governanca-migracao-20260720

      - name: Correct Excel auto-filter range
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migration/legacy-data.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  worksheet.autoFilter = worksheet.dimensions;"
          new = "  if (worksheet.columnCount > 0 && worksheet.rowCount > 0) {\n    const lastColumn = worksheet.getColumn(worksheet.columnCount).letter;\n    worksheet.autoFilter = `A1:${lastColumn}${worksheet.rowCount}`;\n  }"
          if text.count(old) != 1:
              raise SystemExit('Trecho esperado não encontrado exatamente uma vez.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migration/legacy-data.mjs
          git commit -m "fix: corrigir intervalo do filtro no relatório de migração"
          git push origin HEAD:feat/governanca-migracao-20260720
