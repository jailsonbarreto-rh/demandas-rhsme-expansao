name: Temporary dependency lock generation

on:
  push:
    branches:
      - chore/dependency-patch-updates

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-patch-updates

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Generate updated lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): atualizar package-lock"
          git push origin HEAD:chore/dependency-patch-updates
