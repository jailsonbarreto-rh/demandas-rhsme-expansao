name: TypeScript 6 lockfile generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate TypeScript 6 manifest and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Detect whether generation is required
        id: version
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').devDependencies.typescript")" = "6.0.3" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate manifest and lockfile with npm
        if: steps.version.outputs.needs_update == 'true'
        run: npm install --save-dev --save-exact typescript@6.0.3 --package-lock-only --ignore-scripts

      - name: Verify exact TypeScript version
        if: steps.version.outputs.needs_update == 'true'
        run: node -e "const p=require('./package.json'); if(p.devDependencies.typescript!=='6.0.3') throw new Error('TypeScript version mismatch')"

      - name: Verify reproducible install
        if: steps.version.outputs.needs_update == 'true'
        run: npm ci

      - name: Verify compiler version
        if: steps.version.outputs.needs_update == 'true'
        run: npx tsc --version

      - name: Commit generated files to the branch
        if: steps.version.outputs.needs_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: atualizar TypeScript para 6.0.3"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
