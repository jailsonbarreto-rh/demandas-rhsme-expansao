name: TypeScript 6 lockfile generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate TypeScript 6 manifest and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Generate manifest and lockfile with npm
        run: npm install --save-dev --save-exact typescript@6.0.3 --package-lock-only --ignore-scripts

      - name: Verify exact TypeScript version
        run: node -e "const p=require('./package.json'); if(p.devDependencies.typescript!=='6.0.3') throw new Error('TypeScript version mismatch')"

      - name: Verify reproducible install
        run: npm ci

      - name: Verify compiler version
        run: npx tsc --version

      - name: Upload generated files
        uses: actions/upload-artifact@v7
        with:
          name: typescript6-manifest-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
