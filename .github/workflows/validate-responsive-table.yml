name: Validate responsive demand table

on:
  push:
    branches:
      - fix/tabela-responsiva-largura-fluida

permissions:
  contents: read

jobs:
  responsive-table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run responsive table scenarios
        run: npx playwright test tests/e2e/responsive-table.spec.ts --project=chromium-desktop
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-table-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
